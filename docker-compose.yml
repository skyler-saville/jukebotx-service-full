name: jukebotx-${ENV:-development}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jukebotx
      POSTGRES_USER: jukebotx
      POSTGRES_PASSWORD: jukebotx
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    environment:
      PYTHONPATH: /app/apps/api:/app/packages/core:/app/packages/infra
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on:
      - db
      - minio

  worker:
    environment:
      PYTHONPATH: /app/apps/worker:/app/packages/core:/app/packages/infra
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    depends_on:
      - db
      - minio

  bot:
    environment:
      PYTHONPATH: /app/apps/bot:/app/packages/core:/app/packages/infra
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file: .env
    depends_on:
      - db
      - minio
      - lavalink

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: ${LAVALINK_JAVA_OPTIONS:--Xmx1G}
      SERVER_PORT: 2333
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
    expose:
      - "2333"
    volumes:
      - lavalink_plugins:/opt/Lavalink/plugins

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  pgdata:
  minio_data:
  lavalink_plugins:
